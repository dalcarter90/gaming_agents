[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gaming-agents"
version = "0.1.0"
description = "Agents that learn to play games by playing them, on a curriculum from simple to advanced."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
gaming-agents = "gaming_agents.cli:main"

[tool.setuptools.packages.find]
include = ["gaming_agents*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
